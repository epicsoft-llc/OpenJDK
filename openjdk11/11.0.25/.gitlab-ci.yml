variables:
  OPENJDK11_IMAGE_TAG: 11.0.25
  OPENJDK11_PATH: openjdk11/$OPENJDK11_IMAGE_TAG

jre11:
  stage: build
  script:
    #### Build Docker image
    - docker build --pull --no-cache -t $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG -f $OPENJDK11_PATH/jre.Dockerfile . --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions
    - docker run --rm $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG cat /etc/alpine-release
    - docker run --rm $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG java --version
    #### Tag and push
    - docker push $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG $DOCKER_REGISTRY:jre$OPENJDK11_IMAGE_TAG
    - docker push $DOCKER_REGISTRY:jre$OPENJDK11_IMAGE_TAG

jdk11:
  stage: build
  script:
    #### Build Docker image
    - docker build --pull --no-cache -t $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG -f $OPENJDK11_PATH/jdk.Dockerfile . --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG docker --version
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG cat /etc/alpine-release
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG java --version
    #### Tag and push
    - docker push $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG $DOCKER_REGISTRY:jdk$OPENJDK11_IMAGE_TAG
    - docker push $DOCKER_REGISTRY:jdk$OPENJDK11_IMAGE_TAG
