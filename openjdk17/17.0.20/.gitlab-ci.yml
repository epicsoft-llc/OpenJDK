variables:
  OPENJDK17_IMAGE_TAG: 17.0.20
  OPENJDK17_PATH: openjdk17/$OPENJDK17_IMAGE_TAG

jre17:
  stage: build
  script:
    #### Show the platforms the builder can serve (arm64 needs QEMU binfmt on the runner host)
    - docker buildx inspect --bootstrap
    #### Build and push multi-platform Docker image
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -f $OPENJDK17_PATH/jre.Dockerfile
        -t $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG
        -t $DOCKER_REGISTRY:jre$OPENJDK17_IMAGE_TAG
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions, once per platform
    - for platform in $(echo $BUILD_PLATFORMS | tr ',' ' '); do
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG cat /etc/alpine-release;
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG java --version;
      done

jdk17:
  stage: build
  script:
    #### Show the platforms the builder can serve (arm64 needs QEMU binfmt on the runner host)
    - docker buildx inspect --bootstrap
    #### Build and push multi-platform Docker image
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -f $OPENJDK17_PATH/jdk.Dockerfile
        -t $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG
        -t $DOCKER_REGISTRY:jdk$OPENJDK17_IMAGE_TAG
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions, once per platform
    - for platform in $(echo $BUILD_PLATFORMS | tr ',' ' '); do
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG docker --version;
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG cat /etc/alpine-release;
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG java --version;
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG jq --version;
      done
