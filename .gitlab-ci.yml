stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

#### Multi-platform builds need a runner host with QEMU binfmt handlers registered
default:
  tags:
    - imagex

variables:
  DOCKER_REGISTRY: "epicsoft/openjdk"
  BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

before_script:
  - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_TOKEN
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

after_script:
  - docker logout
  - docker logout $CI_REGISTRY

#### Only latest version
include:
  - openjdk11/11.0.32/.gitlab-ci.yml
  - openjdk17/17.0.20/.gitlab-ci.yml
  - openjdk21/21.0.12/.gitlab-ci.yml
  - openjdk25/25.0.4/.gitlab-ci.yml

#### Release only on the default branch
.releaseOnMain:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#### Re-tagging copies the whole manifest list, so it must not go through
#### docker pull/tag/push - that would flatten the image to the runner platform
release11:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 11
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk11
        -t $CI_REGISTRY_IMAGE:jdk11-latest
        -t $DOCKER_REGISTRY:jdk11
        -t $DOCKER_REGISTRY:jdk11-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG
    #### JRE 11
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre11
        -t $CI_REGISTRY_IMAGE:jre11-latest
        -t $DOCKER_REGISTRY:jre11
        -t $DOCKER_REGISTRY:jre11-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG

release17:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 17
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk17
        -t $CI_REGISTRY_IMAGE:jdk17-latest
        -t $DOCKER_REGISTRY:jdk17
        -t $DOCKER_REGISTRY:jdk17-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG
    #### JRE 17
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre17
        -t $CI_REGISTRY_IMAGE:jre17-latest
        -t $DOCKER_REGISTRY:jre17
        -t $DOCKER_REGISTRY:jre17-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG

release21:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 21
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk21
        -t $CI_REGISTRY_IMAGE:jdk21-latest
        -t $DOCKER_REGISTRY:jdk21
        -t $DOCKER_REGISTRY:jdk21-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK21_IMAGE_TAG
    #### JRE 21
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre21
        -t $CI_REGISTRY_IMAGE:jre21-latest
        -t $DOCKER_REGISTRY:jre21
        -t $DOCKER_REGISTRY:jre21-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK21_IMAGE_TAG

release25:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 25
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk25
        -t $CI_REGISTRY_IMAGE:jdk25-latest
        -t $DOCKER_REGISTRY:jdk25
        -t $DOCKER_REGISTRY:jdk25-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG
    #### JRE 25
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre25
        -t $CI_REGISTRY_IMAGE:jre25-latest
        -t $DOCKER_REGISTRY:jre25
        -t $DOCKER_REGISTRY:jre25-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG
    #### JDK 25 Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk25-debian-headless
        -t $CI_REGISTRY_IMAGE:jdk25-debian-headless-latest
        -t $DOCKER_REGISTRY:jdk25-debian-headless
        -t $DOCKER_REGISTRY:jdk25-debian-headless-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG-debian-headless
    #### JRE 25 Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre25-debian-headless
        -t $CI_REGISTRY_IMAGE:jre25-debian-headless-latest
        -t $DOCKER_REGISTRY:jre25-debian-headless
        -t $DOCKER_REGISTRY:jre25-debian-headless-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG-debian-headless

releaseLatest:
  extends: .releaseOnMain
  stage: release
  variables:
    LATEST_TAG: $OPENJDK25_IMAGE_TAG
  script:
    #### JDK
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk
        -t $CI_REGISTRY_IMAGE:jdk-latest
        -t $DOCKER_REGISTRY:jdk
        -t $DOCKER_REGISTRY:jdk-latest
        $CI_REGISTRY_IMAGE:jdk$LATEST_TAG
    #### JRE, latest is the JRE
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre
        -t $CI_REGISTRY_IMAGE:jre-latest
        -t $CI_REGISTRY_IMAGE:latest
        -t $DOCKER_REGISTRY:jre
        -t $DOCKER_REGISTRY:jre-latest
        -t $DOCKER_REGISTRY:latest
        $CI_REGISTRY_IMAGE:jre$LATEST_TAG
    #### JDK Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk-debian-headless
        -t $CI_REGISTRY_IMAGE:jdk-debian-headless-latest
        -t $DOCKER_REGISTRY:jdk-debian-headless
        -t $DOCKER_REGISTRY:jdk-debian-headless-latest
        $CI_REGISTRY_IMAGE:jdk$LATEST_TAG-debian-headless
    #### JRE Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre-debian-headless
        -t $CI_REGISTRY_IMAGE:jre-debian-headless-latest
        -t $DOCKER_REGISTRY:jre-debian-headless
        -t $DOCKER_REGISTRY:jre-debian-headless-latest
        $CI_REGISTRY_IMAGE:jre$LATEST_TAG-debian-headless

uploadReadme:
  extends: .releaseOnMain
  stage: release
  script:
    - docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD=${DOCKER_HUB_TOKEN}
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="Java OpenJDK-JDK and -JRE Docker images based on official images"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4
