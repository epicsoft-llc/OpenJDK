stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_REGISTRY: "epicsoft/openjdk"

before_script:
  - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_TOKEN
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

after_script:
  - docker logout
  - docker logout $CI_REGISTRY

#### Only latest version
include:
  - openjdk11/11.0.29/.gitlab-ci.yml
  - openjdk17/17.0.17/.gitlab-ci.yml
  - openjdk21/21.0.9/.gitlab-ci.yml

release11:
  stage: release
  script:
    #### JDK 11
    - docker pull $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG $CI_REGISTRY_IMAGE:jdk11
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG $DOCKER_REGISTRY:jdk11
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG $CI_REGISTRY_IMAGE:jdk11-latest
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG $DOCKER_REGISTRY:jdk11-latest
    - docker push $CI_REGISTRY_IMAGE:jdk11
    - docker push $DOCKER_REGISTRY:jdk11
    - docker push $CI_REGISTRY_IMAGE:jdk11-latest
    - docker push $DOCKER_REGISTRY:jdk11-latest
    #### JRE 11
    - docker pull $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG $CI_REGISTRY_IMAGE:jre11
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG $DOCKER_REGISTRY:jre11
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG $CI_REGISTRY_IMAGE:jre11-latest
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG $DOCKER_REGISTRY:jre11-latest
    - docker push $CI_REGISTRY_IMAGE:jre11
    - docker push $DOCKER_REGISTRY:jre11
    - docker push $CI_REGISTRY_IMAGE:jre11-latest
    - docker push $DOCKER_REGISTRY:jre11-latest

release17:
  stage: release
  script:
    #### JDK 17
    - docker pull $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG $CI_REGISTRY_IMAGE:jdk17
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG $DOCKER_REGISTRY:jdk17
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG $CI_REGISTRY_IMAGE:jdk17-latest
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG $DOCKER_REGISTRY:jdk17-latest
    - docker push $CI_REGISTRY_IMAGE:jdk17
    - docker push $DOCKER_REGISTRY:jdk17
    - docker push $CI_REGISTRY_IMAGE:jdk17-latest
    - docker push $DOCKER_REGISTRY:jdk17-latest
    #### JRE 17
    - docker pull $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG $CI_REGISTRY_IMAGE:jre17
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG $DOCKER_REGISTRY:jre17
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG $CI_REGISTRY_IMAGE:jre17-latest
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG $DOCKER_REGISTRY:jre17-latest
    - docker push $CI_REGISTRY_IMAGE:jre17
    - docker push $DOCKER_REGISTRY:jre17
    - docker push $CI_REGISTRY_IMAGE:jre17-latest
    - docker push $DOCKER_REGISTRY:jre17-latest

release21:
  stage: release
  script:
    #### JDK 21
    - docker pull $CI_REGISTRY_IMAGE:jdk$OPENJDK21_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK21_IMAGE_TAG $CI_REGISTRY_IMAGE:jdk21
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK21_IMAGE_TAG $DOCKER_REGISTRY:jdk21
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK21_IMAGE_TAG $CI_REGISTRY_IMAGE:jdk21-latest
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK21_IMAGE_TAG $DOCKER_REGISTRY:jdk21-latest
    - docker push $CI_REGISTRY_IMAGE:jdk21
    - docker push $DOCKER_REGISTRY:jdk21
    - docker push $CI_REGISTRY_IMAGE:jdk21-latest
    - docker push $DOCKER_REGISTRY:jdk21-latest
    #### JRE 21
    - docker pull $CI_REGISTRY_IMAGE:jre$OPENJDK21_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK21_IMAGE_TAG $CI_REGISTRY_IMAGE:jre21
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK21_IMAGE_TAG $DOCKER_REGISTRY:jre21
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK21_IMAGE_TAG $CI_REGISTRY_IMAGE:jre21-latest
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK21_IMAGE_TAG $DOCKER_REGISTRY:jre21-latest
    - docker push $CI_REGISTRY_IMAGE:jre21
    - docker push $DOCKER_REGISTRY:jre21
    - docker push $CI_REGISTRY_IMAGE:jre21-latest
    - docker push $DOCKER_REGISTRY:jre21-latest

releaseLatest:
  stage: release
  variables:
    LATEST_TAG: $OPENJDK21_IMAGE_TAG
  script:
    #### JDK
    - docker pull $CI_REGISTRY_IMAGE:jdk$LATEST_TAG
    - docker tag $CI_REGISTRY_IMAGE:jdk$LATEST_TAG $CI_REGISTRY_IMAGE:jdk
    - docker tag $CI_REGISTRY_IMAGE:jdk$LATEST_TAG $DOCKER_REGISTRY:jdk
    - docker tag $CI_REGISTRY_IMAGE:jdk$LATEST_TAG $CI_REGISTRY_IMAGE:jdk-latest
    - docker tag $CI_REGISTRY_IMAGE:jdk$LATEST_TAG $DOCKER_REGISTRY:jdk-latest
    - docker push $CI_REGISTRY_IMAGE:jdk
    - docker push $DOCKER_REGISTRY:jdk
    - docker push $CI_REGISTRY_IMAGE:jdk-latest
    - docker push $DOCKER_REGISTRY:jdk-latest
    #### JRE
    - docker pull $CI_REGISTRY_IMAGE:jre$LATEST_TAG
    - docker tag $CI_REGISTRY_IMAGE:jre$LATEST_TAG $CI_REGISTRY_IMAGE:jre
    - docker tag $CI_REGISTRY_IMAGE:jre$LATEST_TAG $DOCKER_REGISTRY:jre
    - docker tag $CI_REGISTRY_IMAGE:jre$LATEST_TAG $CI_REGISTRY_IMAGE:jre-latest
    - docker tag $CI_REGISTRY_IMAGE:jre$LATEST_TAG $DOCKER_REGISTRY:jre-latest
    - docker tag $CI_REGISTRY_IMAGE:jre$LATEST_TAG $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:jre$LATEST_TAG $DOCKER_REGISTRY:latest
    - docker push $CI_REGISTRY_IMAGE:jre
    - docker push $DOCKER_REGISTRY:jre
    - docker push $CI_REGISTRY_IMAGE:jre-latest
    - docker push $DOCKER_REGISTRY:jre-latest
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $DOCKER_REGISTRY:latest

uploadReadme:
  stage: release
  script:
    - docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD=${DOCKER_HUB_TOKEN}
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="Java OpenJDK-JDK and -JRE Docker images based on official images"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4
