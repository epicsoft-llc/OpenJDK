    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG-debian-headless $DOCKER_REGISTRY:jre$OPENJDK25_IMAGE_TAG-debian-headless
    - docker push $DOCKER_REGISTRY:jre$OPENJDK25_IMAGE_TAG-debian-headless

jdk25DebianHeadless:
  stage: build
  script:
    #### Build Docker image
    - docker build --pull --no-cache -t $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG-debian-headless -f $OPENJDK25_PATH/jdk.debian-headless.Dockerfile . --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG-debian-headless cat /etc/debian_version
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG-debian-headless java --version
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG-debian-headless jq --version
    #### Tag and push
    - docker push $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG-debian-headless
