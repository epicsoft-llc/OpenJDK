variables:
  OPENJDK25_IMAGE_TAG: 25.0.4
  OPENJDK25_PATH: openjdk25/$OPENJDK25_IMAGE_TAG

jre25:
  stage: build
  script:
    #### Show the platforms the builder can serve (arm64 needs QEMU binfmt on the runner host)
    - docker buildx inspect --bootstrap
    #### Build and push multi-platform Docker image
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -f $OPENJDK25_PATH/jre.Dockerfile
        -t $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG
        -t $DOCKER_REGISTRY:jre$OPENJDK25_IMAGE_TAG
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions, once per platform
    - for platform in $(echo $BUILD_PLATFORMS | tr ',' ' '); do
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG cat /etc/alpine-release;
        docker run --rm --platform $platform $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG java --version;
      done

