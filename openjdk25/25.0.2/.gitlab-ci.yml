variables:
  OPENJDK25_IMAGE_TAG: 25.0.2
  OPENJDK25_PATH: openjdk21/$OPENJDK25_IMAGE_TAG

jre25:
  stage: build
  script:
    #### Build Docker image
    - docker build --pull --no-cache -t $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG -f $OPENJDK25_PATH/jre.Dockerfile . --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions
    - docker run --rm $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG cat /etc/alpine-release
    - docker run --rm $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG java --version
    #### Tag and push
    - docker push $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG $DOCKER_REGISTRY:jre$OPENJDK25_IMAGE_TAG
    - docker push $DOCKER_REGISTRY:jre$OPENJDK25_IMAGE_TAG

jdk25:
  stage: build
  script:
    #### Build Docker image
    - docker build --pull --no-cache -t $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG -f $OPENJDK25_PATH/jdk.Dockerfile . --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### Versions
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG docker --version
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG cat /etc/alpine-release
    - docker run --rm $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG java --version
    #### Tag and push
    - docker push $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG $DOCKER_REGISTRY:jdk$OPENJDK25_IMAGE_TAG
    - docker push $DOCKER_REGISTRY:jdk$OPENJDK25_IMAGE_TAG
